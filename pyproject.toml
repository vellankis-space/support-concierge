[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-concierge"
version = "0.1.0"
description = "Multi-agent support ticket triage prototype"
requires-python = ">=3.12"
dependencies = [
  "groq>=0.33.0",
  "langgraph>=0.6.0",
  "pydantic>=2.12.0",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.0.0",
  "ruff>=0.9.0",
]

[project.scripts]
support-concierge = "support_concierge.cli:app"

[tool.setuptools.packages.find]
include = ["support_concierge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
